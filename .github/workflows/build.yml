name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak project dari BubbAssistant.zip
        run: |
          if [ -f BubbAssistant.zip ]; then unzip -o BubbAssistant.zip; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BubbAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Buat Release agar APK mudah diunduh dari HP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bubb Assistant build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
